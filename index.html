<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico Mercado Livre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#0d0c0a; --line:#2a2722; --ink:#f5f3ee; --muted:#8f8a80;
  --y:#ffcc00; --y-2:#f5b800; --y-soft:rgba(255,204,0,.14); --ok:#25d366;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,transparent 40%,#000 95%)}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:30px 20px 60px}
.hide{display:none!important}
.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Capa ---------- */
.intro{text-align:center;padding-top:10px}
.intro h1{font-weight:700;letter-spacing:-.03em;line-height:1.02;font-size:clamp(38px,10.5vw,62px)}
.intro h1 span{display:block;font-size:.56em;margin-top:8px;letter-spacing:-.02em;line-height:1.15}
.intro h1 em{font-style:normal;color:var(--y)}
.intro h1 em.sh{color:#ff6a3d}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:26px auto 0}
.pcol{position:relative}
.ph{aspect-ratio:4/5;border-radius:12px;background:var(--card);position:relative;overflow:hidden;display:grid;place-items:center;
  opacity:0;transform:translateY(14px)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.before img{filter:grayscale(1) contrast(1.05) brightness(.9)}
.ph.after img{filter:grayscale(1);transform:scale(1.08);transition:filter 1.4s ease,transform 2.4s cubic-bezier(.2,.7,.2,1)}
.play .ph.before{animation:rise .7s cubic-bezier(.2,.7,.2,1) .15s forwards}
.play .ph.after{animation:rise .7s cubic-bezier(.2,.7,.2,1) .75s forwards}
.play.color .ph.after img{filter:none;transform:scale(1)}
@keyframes rise{to{opacity:1;transform:none}}
.ph .empty{color:var(--muted);font-size:13px;padding:14px;line-height:1.4}
.ph .empty svg{display:block;margin:0 auto 8px;opacity:.6}
.plbl{position:absolute;left:10px;bottom:10px;z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;font-weight:500;
  padding:5px 11px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stat{margin:26px auto 0;max-width:440px;opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
.stat.in{opacity:1;transform:none}
.stat .num{font-variant-numeric:tabular-nums;font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.03em;color:var(--y);line-height:1}
.stat .num small{font-size:.42em;color:var(--muted);font-weight:500;margin-right:6px;vertical-align:.45em;letter-spacing:0}
.stat .cap{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:#cfc9bd;font-size:15px}
.stat .cap img{width:22px;height:22px;border-radius:6px}
.later{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.later.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.ph,.stat,.later{opacity:1!important;transform:none!important;animation:none!important}}
.intro p{color:var(--muted);font-size:16px;line-height:1.55;margin:22px auto 0;max-width:360px}

.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:440px;margin:28px auto 0;
  border:1px solid rgba(255,230,140,.6);border-radius:12px;cursor:pointer;text-decoration:none;
  background:linear-gradient(180deg,#ffd83a,var(--y-2));color:#120e00;font:700 17px "IBM Plex Sans",sans-serif;padding:19px 22px;
  box-shadow:0 0 0 1px rgba(255,204,0,.15),0 10px 40px -6px rgba(255,204,0,.55);transition:transform .15s, box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn .arr{transition:transform .2s} .btn:hover .arr{transform:translateX(4px)}
.btn.start{font-size:clamp(19px,5.2vw,22px);padding:21px 22px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,204,0,.25),0 14px 60px -2px rgba(255,204,0,.8)}}

/* ---------- Progresso ---------- */
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:38px}
.prog i{height:3px;border-radius:2px;background:#2b2b2b;position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:var(--y);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.prog i.on::after{transform:scaleX(1)}

/* ---------- Pergunta ---------- */
.q h2{font-size:clamp(28px,7.4vw,36px);font-weight:700;letter-spacing:-.025em;line-height:1.12;margin-bottom:26px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font:600 16px "IBM Plex Sans",sans-serif;padding:20px;cursor:pointer;transition:border-color .15s, box-shadow .15s, background .15s;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:#4a4538}
.opt.sel{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset,0 0 22px -6px rgba(255,204,0,.45);background:#110f08}
.visual{margin:28px auto 0;max-width:520px}
.back{display:inline-block;margin-top:28px;background:none;border:0;color:var(--muted);font:500 15px "IBM Plex Sans",sans-serif;cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}

/* ---------- Visual 1: 3 notificações ---------- */
.notifs{position:relative;height:224px;max-width:520px;margin:0 auto}
.notif{position:absolute;left:0;right:0;top:0;height:68px;display:flex;align-items:center;gap:14px;background:rgba(14,13,11,.97);border:1px solid #2c2a26;border-radius:18px;padding:0 16px;
  opacity:0;transform:translateY(-40px) scale(.94);transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.notif .app{width:40px;height:40px;border-radius:10px;overflow:hidden;background:var(--y);flex:none;display:grid;place-items:center}
.notif .tx{flex:1;min-width:0}
.notif b{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.notif b small{font-weight:400;color:var(--muted);font-size:13px}
.notif span{display:block;font-size:15px;color:#ddd8cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Visual 2: fluxo ---------- */
.flow{--c:clamp(58px,15.5vw,78px);--m:clamp(66px,17.5vw,88px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 6px 18px}
.flow-row{display:grid;grid-template-columns:1fr 1fr 1fr;position:relative}
.node{text-align:center;position:relative;z-index:2}
.cwrap{height:var(--m);display:grid;place-items:center}
.circ{width:var(--c);height:var(--c);border-radius:50%;border:2px solid #3a372f;background:#000;display:grid;place-items:center}
.circ svg{width:58%;height:58%}
.node.main .circ{width:var(--m);height:var(--m);border-color:var(--y)}
.node.main .circ svg{width:56%;height:56%}
.node b{display:block;margin-top:10px;font-size:clamp(14px,3.9vw,17px)}
.node.main b{color:var(--y)}
.node small{display:block;color:var(--muted);font-size:clamp(12px,3.3vw,14px);margin-top:1px}
.seg{position:absolute;height:2px;z-index:1;
  background:repeating-linear-gradient(90deg,#4a463c 0 6px,transparent 6px 12px);
  animation:march 1.1s linear infinite}
@keyframes march{from{background-position:0 0}to{background-position:12px 0}}
.pkg{position:absolute;left:0;top:0;z-index:3;opacity:0;will-change:transform,opacity}
.pkg svg{width:100%;height:100%;display:block}

/* ---------- Visual 3: marketplaces ---------- */
.mk{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:700px}
.mkc{background:linear-gradient(180deg,#1b1915,#100f0c);border:1px solid #2f2c26;border-radius:14px;padding:22px 10px 20px;text-align:center;
  box-shadow:0 8px 0 -2px #14130f,0 9px 0 -1px #26241f;transition:transform .35s,border-color .3s,box-shadow .3s}
.mkc:first-child{transform:rotateY(8deg)} .mkc:last-child{transform:rotateY(-8deg)}
.mkc.hl{border-color:var(--y);transform:rotateY(0) translateY(-4px);box-shadow:0 8px 0 -2px #14130f,0 0 30px -8px rgba(255,204,0,.5)}
.mkc .ic{width:56px;height:56px;border-radius:12px;overflow:hidden;margin:0 auto 12px;display:grid;place-items:center}
.mkc b{font-size:16px;color:#e7e3da}

/* ---------- Visual 4: relógio ---------- */
.clock-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 20px 24px;text-align:center}
.clock-card svg{display:block;margin:0 auto}
.clock-card p{color:var(--muted);font-size:14px;margin-top:16px;min-height:20px}

/* ---------- Analisando ---------- */
.anl{text-align:center;padding-top:20px}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring > svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:-.02em;transition:opacity .3s,transform .3s}
.ring .chk{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4)}
.ring.done .pct{opacity:0;transform:scale(.6)}
.ring.done .chk{animation:pop .55s cubic-bezier(.2,.9,.3,1.4) forwards}
.ring.done #rg{stroke:var(--y)}
.ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.25),transparent 65%);opacity:0;transition:opacity .5s}
.ring.done::before{opacity:1}
@keyframes pop{to{opacity:1;transform:none}}
.chk path{stroke-dasharray:60;stroke-dashoffset:60}
.ring.done .chk path{animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anl h2{font-size:clamp(26px,7vw,32px);letter-spacing:-.02em;margin-top:28px;min-height:1.2em}
.dots i{font-style:normal;animation:dot 1.2s infinite;opacity:0}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{30%,60%{opacity:1}100%{opacity:0}}
.anl .sub{color:var(--muted);margin-top:8px;min-height:1.5em}
.steps{max-width:360px;margin:28px auto 0;text-align:left;display:grid;gap:12px}
.st{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;opacity:.35;transition:opacity .3s,color .3s}
.st.act{opacity:1;color:var(--ink)}
.st.ok{opacity:1;color:var(--ink)}
.st i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #3a372f;display:grid;place-items:center;position:relative}
.st.act i{border-color:var(--y);border-right-color:transparent;animation:rot .7s linear infinite}
.st.ok i{border-color:var(--y);background:var(--y)}
.st.ok i::after{content:"";width:5px;height:9px;border:solid #120e00;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes rot{to{transform:rotate(360deg)}}
.burst{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--y);pointer-events:none}

/* ---------- Vídeo ---------- */
.final{text-align:center}
.final .tagline{color:#bdb7ac;font-size:clamp(18px,4.8vw,22px);line-height:1.45;max-width:470px;margin:0 auto 26px}
.final .tagline strong{color:#fff;font-weight:700}
.diag{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--y);border:1px solid rgba(255,204,0,.35);border-radius:99px;padding:6px 14px;margin-bottom:18px;background:var(--y-soft)}
.video{position:relative;aspect-ratio:16/9;background:#0b0a08;border:1px solid var(--line);overflow:hidden}
.video iframe,.video video,.video #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.demo{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;cursor:pointer}
.demo .play{width:68px;height:68px;border-radius:50%;background:var(--y);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 0 40px rgba(255,204,0,.4);transition:transform .2s}
.demo:hover .play{transform:scale(1.06)}
.vbar{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--y)}
.lock{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;margin-top:18px}
.cta{opacity:0;transform:translateY(20px);pointer-events:none;max-height:0;overflow:hidden;transition:opacity .6s,transform .6s}
.cta.show{opacity:1;transform:none;pointer-events:auto;max-height:none;overflow:visible}
.cta .ready{color:var(--ink);font-weight:600;font-size:17px;margin-top:26px}
.btn.wa{background:#22d366;border:0;border-radius:18px;color:#0d2416;font-size:clamp(17px,4.8vw,20px);font-weight:700;padding:24px 22px;
  box-shadow:0 14px 44px -10px rgba(34,211,102,.55);margin-top:16px}
.btn.wa:hover{background:#2bdc70}
.btn.wa.glow{animation:waglow 2s ease-in-out infinite}
@keyframes waglow{50%{box-shadow:0 14px 56px -6px rgba(34,211,102,.8)}}
.wa-fail{background:none;border:0;color:#ff5a5a;font:500 14px "IBM Plex Sans",sans-serif;margin-top:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.wa-num{display:none;margin:12px auto 0;max-width:440px;background:var(--card);border:1px solid #4a2626;border-radius:12px;padding:14px 16px;font-size:15px;color:var(--ink);
  align-items:center;justify-content:space-between;gap:12px;text-align:left}
.wa-num.show{display:flex;animation:enter .3s ease}
.wa-num small{display:block;color:var(--muted);font-size:13px}
.wa-num b{font-size:18px;letter-spacing:.01em}
.wa-copy{flex:none;background:#1c1a16;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer}
.summary{margin:26px auto 0;max-width:520px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.summary h3{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:10px}
.summary li{list-style:none;display:flex;gap:10px;font-size:15px;padding:6px 0;border-top:1px solid #1d1b17}
.summary li:first-child{border-top:0}
.summary li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--y);margin-top:8px}
</style>
</head>
<body>
<main class="wrap">

  <section id="intro" class="intro enter">
    <h1>Como eu saí do CLT <span>para viver do <em>Mercado Livre</em> e&nbsp;<em class="sh">Shopee</em></span></h1>
    <div class="photos" id="photos">
      <div class="pcol"><div class="ph before" id="ph-antes"></div></div>
      <div class="pcol"><div class="ph after" id="ph-hoje"></div></div>
    </div>
    <div class="stat" id="stat">
      <div class="num"><span id="stat-n"></span></div>
      <div class="cap" id="stat-cap">faturados com Mercado Livre e Shopee</div>
    </div>
    <p class="later">Responda 4 perguntas rápidas e descubra o que falta para você fazer o mesmo.</p>
    <button class="btn pulse start later" id="start">Começar o diagnóstico</button>
  </section>

  <section id="quiz" class="hide">
    <div class="prog" id="prog"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="qbox"></div>
    <button class="back" id="back">Voltar</button>
  </section>

  <section id="anl" class="hide anl"></section>
  <section id="final" class="hide final"></section>
</main>

const fmtStat = v => "R$ "+v+" mil+";
$("#stat-n").textContent = fmtStat(0);
function introAnim(){
  const T=(ms,fn)=>setTimeout(fn,ms);
  T(50,  ()=>$("#photos").classList.add("play"));
  T(1700,()=>$("#photos").classList.add("color"));
  T(1900,()=>{
    $("#stat").classList.add("in");
    const el=$("#stat-n"), alvo=CONFIG.faturamentoMil, t0=performance.now(), D=3200;
    const step=now=>{ const p=Math.min(1,(now-t0)/D), e=1-Math.pow(1-p,4);
      el.textContent=fmtStat(Math.round(alvo*e)); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  T(2600,()=>document.querySelectorAll(".later").forEach(x=>x.classList.add("in")));
}
if(matchMedia("(prefers-reduced-motion: reduce)").matches){
  $("#photos").classList.add("play","color");
  document.querySelectorAll(".stat,.later").forEach(x=>x.classList.add("in"));
  $("#stat-n").textContent=fmtStat(CONFIG.faturamentoMil);
} else introAnim();

/* ---------- Visual 1: 3 notificações que entram uma a uma e ficam ---------- */
function vNotifs(el){
  // A lista é exibida de cima para baixo no final; a chegada é de baixo para cima:
  // cada venda nova entra no topo e empurra as anteriores para baixo.
  const SLOT = 78;
  const box = document.createElement("div"); box.className = "notifs"; el.appendChild(box);
  const vendas = CONFIG.vendas.slice(0,3).reverse();
  const shown = [];
  vendas.forEach(([p,t],i)=> later(()=>{
    const n = document.createElement("div"); n.className = "notif";
    n.innerHTML = `<div class="app">${img(CONFIG.iconeMercadoLivre, ICON.bag)}</div><div class="tx"><b>Você vendeu! <small>${t}</small></b><span>${p}</span></div>`;
    box.appendChild(n); shown.unshift(n); saleSound(i===vendas.length-1);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      shown.forEach((it,k)=>{ it.style.transform = `translateY(${k*SLOT}px)`; it.style.opacity = 1; });
    }));
  }, 350 + i*1100));
}

/* ---------- Visual 2: fluxo Fornecedor → Loja → Cliente ---------- */
function vFlow(el){
  el.innerHTML = `<div class="flow"><div class="flow-row" id="frow">
    <div class="node"><div class="cwrap"><div class="circ">${ICON.warehouse}</div></div><b>Fornecedor</b><small>guarda e envia</small></div>
    <div class="node main"><div class="cwrap"><div class="circ" id="c-loja">${ICON.store}</div></div><b>Sua loja</b><small>anuncia e vende</small></div>
    <div class="node"><div class="cwrap"><div class="circ" id="c-cli">${ICON.user}</div></div><b>Cliente</b><small>recebe em casa</small></div>
    <div class="seg" id="s1"></div><div class="seg" id="s2"></div>
    <div class="pkg" id="pkg">${ICON.pkg}</div>
  </div></div>`;
  let anims = [];
  const build = ()=>{
    anims.forEach(a=>a.cancel()); anims=[];
    const row = el.querySelector("#frow"); if(!row) return;
    const R = row.getBoundingClientRect();
    const C = [...row.querySelectorAll(".circ")].map(c=>{const b=c.getBoundingClientRect();return {x:b.left-R.left+b.width/2,y:b.top-R.top+b.height/2,r:b.width/2}});
    const gap=6, y=C[0].y; const pkgEl = el.querySelector("#pkg");
    const place=(s,a,b)=>{ s.style.left=(a.x+a.r+gap)+"px"; s.style.width=Math.max(0,(b.x-b.r-gap)-(a.x+a.r+gap))+"px"; s.style.top=(y-1)+"px"; };
    place(el.querySelector("#s1"),C[0],C[1]); place(el.querySelector("#s2"),C[1],C[2]);
    const P=Math.round(C[0].r*0.78); pkgEl.style.width=pkgEl.style.height=P+"px"; const T=(x,sc)=>`translate(${x-P/2}px,${y-P/2}px) scale(${sc})`;
    const F=C[0].x, L=C[1].x, K=C[2].x, mv="cubic-bezier(.65,0,.35,1)";
    const pkg = pkgEl;
    const DUR = 8500;
    anims.push(pkg.animate([
      {offset:0,   transform:T(F,.6), opacity:0},
      {offset:.05, transform:T(F,1),  opacity:1},
      {offset:.12, transform:T(F,1),  opacity:1, easing:mv},   // sai do fornecedor
      {offset:.32, transform:T(L,1.12), opacity:1},
      {offset:.50, transform:T(L,1.12), opacity:1, easing:mv}, // parado na frente da loja
      {offset:.70, transform:T(K,1),  opacity:1},
      {offset:.88, transform:T(K,1),  opacity:1},              // chegou no cliente
      {offset:.96, transform:T(K,.6), opacity:0},
      {offset:1,   transform:T(F,.6), opacity:0},
    ],{duration:DUR,iterations:Infinity}));
  };
  requestAnimationFrame(build);
  const onR = ()=>build(); addEventListener("resize",onR);
  document.fonts && document.fonts.ready.then(()=>build());
  cleanups.push(()=>{ removeEventListener("resize",onR); anims.forEach(a=>a.cancel()); });
}

/* ---------- Visual 4: relógio (animação única e suave) ---------- */
/* Relógio: sem opção marcada, só o ponteiro gira. Ao marcar, o ponteiro
   vai até o tempo escolhido e a fatia amarela aparece junto. */
const CLOCK = { hand:0, span:0, alpha:0, mode:"idle", target:0, raf:0, last:0 };
const CLOCK_DEG = [50,110,200];
const CLOCK_TXT = ["Poucas horas por dia, bem usadas","Tempo suficiente para crescer rápido","Ritmo forte para acelerar os resultados"];
const CLOCK_IDLE_TXT = "Escolha uma opção acima";
const CLOCK_SPEED = 140;   // graus por segundo enquanto gira
function vClock(el){
  let ticks="";
  for(let i=0;i<12;i++){ const a=i*Math.PI/6, big=i%3===0, r1=big?43:47, r2=53;
    ticks+=`<line x1="${(65+r1*Math.sin(a)).toFixed(2)}" y1="${(65-r1*Math.cos(a)).toFixed(2)}" x2="${(65+r2*Math.sin(a)).toFixed(2)}" y2="${(65-r2*Math.cos(a)).toFixed(2)}" stroke="${big?'#eee':'#5a5a5a'}" stroke-width="${big?2.5:1.5}" stroke-linecap="round"/>`; }
  el.innerHTML = `<div class="clock-card">
    <svg width="150" height="150" viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="62" fill="#050505" stroke="#3a372f" stroke-width="1.5"/>
      <path id="sector" fill="rgba(255,204,0,.18)" stroke="#ffcc00" stroke-width="1.2" stroke-linejoin="round" opacity="0"/>
      ${ticks}
      <line x1="65" y1="65" x2="65" y2="26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line id="hand" x1="65" y1="65" x2="65" y2="18" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="65" cy="65" r="4" fill="#ffcc00"/>
    </svg><p id="clock-t"></p></div>`;
  CLOCK.hand=0; CLOCK.span=0; CLOCK.alpha=0;
  if(ans.tempo!=null) setClock(ans.tempo); else idleClock();
  CLOCK.last=performance.now();
  cancelAnimationFrame(CLOCK.raf);
  const tick=now=>{
    const dt=Math.min(.05,(now-CLOCK.last)/1000); CLOCK.last=now;
    const k=1-Math.pow(.002,dt);                  // suavização igual em qualquer celular
    if(CLOCK.mode==="idle"){
      CLOCK.hand=(CLOCK.hand+CLOCK_SPEED*dt)%360;
      CLOCK.span+=(0-CLOCK.span)*k; CLOCK.alpha+=(0-CLOCK.alpha)*k;
    } else {
      CLOCK.hand+=(CLOCK.target-CLOCK.hand)*k;
      CLOCK.span+=(CLOCK.target-CLOCK.span)*k; CLOCK.alpha+=(1-CLOCK.alpha)*k;
    }
    drawClock();
    CLOCK.raf=requestAnimationFrame(tick);
  };
  CLOCK.raf=requestAnimationFrame(tick);
  let tac=false; const tt=setInterval(()=>{ tickSound(tac); tac=!tac; },500);
  cleanups.push(()=>{ cancelAnimationFrame(CLOCK.raf); clearInterval(tt); });
}
function drawClock(){
  const sec=$("#sector"), h=$("#hand"); if(!sec) return;
  const r=56, span=Math.max(.01,Math.min(359.9,CLOCK.span)), a=span*Math.PI/180;
  sec.setAttribute("d",`M65 65 L65 ${65-r} A${r} ${r} 0 ${span>180?1:0} 1 ${(65+r*Math.sin(a)).toFixed(2)} ${(65-r*Math.cos(a)).toFixed(2)} Z`);
  sec.setAttribute("opacity",CLOCK.alpha.toFixed(3));
  h.setAttribute("transform",`rotate(${CLOCK.hand.toFixed(2)} 65 65)`);
}
function setClock(i){
  // o ponteiro segue em frente até o tempo marcado, sem voltar para trás
  if(CLOCK.mode==="idle" && CLOCK.hand>CLOCK_DEG[i]) CLOCK.hand-=360;
  CLOCK.mode="set"; CLOCK.target=CLOCK_DEG[i];
  const t=$("#clock-t"); if(t) t.textContent=CLOCK_TXT[i];
}
function idleClock(){ CLOCK.hand=((CLOCK.hand%360)+360)%360; CLOCK.mode="idle"; const t=$("#clock-t"); if(t) t.textContent=CLOCK_IDLE_TXT; }

let silentEl=null;
function unlockAudio(){
  try{
    // iPhone: faz o som tocar mesmo com a chave de silencioso e libera o áudio no toque
    if(navigator.audioSession){ try{ navigator.audioSession.type="playback"; }catch(e){} }
    if(!silentEl){ silentEl=new Audio(SILENCIO); silentEl.setAttribute("playsinline",""); }
    const pr=silentEl.play(); if(pr && pr.catch) pr.catch(()=>{});
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=="running") AC.resume();
    const sb=AC.createBufferSource(); sb.buffer=AC.createBuffer(1,1,22050); sb.connect(AC.destination); sb.start(0);
    const load=(url,set)=>{ const bin=atob(url.split(",")[1]), u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      AC.decodeAudioData(u.buffer, set, ()=>{}); };
    if(!SALE_BUF) load(SOM_VENDA, b=>{ SALE_BUF=b; });
    if(!SALE_BUF_LONG) load(SOM_VENDA_LONGO, b=>{ SALE_BUF_LONG=b; });
  }catch(e){}
}
function tickSound(tac){
  if(!AC || !CONFIG.volumeTicTac) return;
  try{
    const t=AC.currentTime, n=Math.floor(AC.sampleRate*.025), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(AC.sampleRate*.0025));
    const src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    src.buffer=b; f.type="bandpass"; f.frequency.value=tac?2600:3400; f.Q.value=6;
    g.gain.value=CONFIG.volumeTicTac*4;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
  }catch(e){}
}
function saleSound(ultima){
  // vendas 1 e 2: som curto · última venda: som completo, sem corte
  const buf = (ultima && SALE_BUF_LONG) || SALE_BUF;
  if(!AC || !buf || !CONFIG.somVendas) return;
  try{
    const src=AC.createBufferSource(), g=AC.createGain();
    g.gain.value=CONFIG.volumeSom; src.buffer=buf; src.connect(g); g.connect(AC.destination); src.start();
  }catch(e){}
}

const VISUALS = { notifs:vNotifs, flow:vFlow, mk:vMk, clock:vClock };
function unhighlight(q){
  if(q.visual==="mk") document.querySelectorAll(".mkc").forEach(c=>c.classList.remove("hl"));
  if(q.visual==="clock") idleClock();
}
function highlight(q,i){
  if(q.visual==="mk") document.querySelectorAll(".mkc").forEach(c=>c.classList.toggle("hl", i===2 || +c.dataset.i===i));
  if(q.visual==="clock") setClock(i);
}

/* ---------- Pergunta ---------- */
const canHover = matchMedia("(hover:hover)").matches;
function renderQ(){
  cleanup();
  const q = QUESTIONS[step];
  setProg(step+1);
  const box = $("#qbox");
  box.className = "q enter";
  box.innerHTML = `<h2>${q.title}</h2><div class="opts"></div><div class="visual"></div>`;
  const opts = box.querySelector(".opts");
  if(canHover) opts.onmouseleave = ()=>{ if(ans[q.id]==null) unhighlight(q); };
  q.opts.forEach((t,i)=>{
    const b = document.createElement("button");
    b.className = "opt"+(ans[q.id]===i?" sel":"");
    b.textContent = t;
    if(canHover) b.onmouseenter = ()=>highlight(q,i);
    b.onclick = ()=>{
      unlockAudio();
      ans[q.id]=i;
      opts.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); highlight(q,i);
      later(()=>{ step++; step<QUESTIONS.length ? renderQ() : renderAnalysis(); }, q.visual==="clock"?700:450);
    };
    opts.appendChild(b);
  });
  VISUALS[q.visual](box.querySelector(".visual"));
  if(ans[q.id]!=null) highlight(q,ans[q.id]);
}

/* ---------- Animação "Diagnóstico concluído" ---------- */
function renderAnalysis(){
  cleanup();
  const el = $("#anl");
  const C = 2*Math.PI*74;
  el.innerHTML = `<div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <div class="enter">
    <div class="ring" id="ring">
      <svg width="170" height="170" viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="74" fill="none" stroke="#1e1c18" stroke-width="8"/>
        <circle id="rg" cx="85" cy="85" r="74" fill="none" stroke="#ffcc00" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="pct" id="pct">0%</div>
      <div class="chk"><svg width="70" height="70" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#ffcc00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <h2 id="anl-t">Fazendo o seu diagnóstico<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
    <p class="sub" id="anl-s">Leva só alguns segundos</p>
    <div class="steps">
      <div class="st" id="st0"><i></i>Identificando o seu momento atual</div>
      <div class="st" id="st1"><i></i>Mapeando o que mais te trava</div>
      <div class="st" id="st2"><i></i>Montando o seu plano de início</div>
    </div></div>`;
  show("anl");
  const rg = $("#rg"), pct = $("#pct"), DUR = 3600, t0 = performance.now();
  let raf;
  const frame = now=>{
    const p = Math.min(1,(now-t0)/DUR);
    const e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    rg.setAttribute("stroke-dashoffset", C*(1-e));
    pct.textContent = Math.round(e*100)+"%";
    const k = Math.min(2, Math.floor(p*3));
    for(let i=0;i<3;i++){ const s=$("#st"+i); s.className = "st"+(i<k||p>=1?" ok":i===k?" act":""); }
    if(p<1) raf=requestAnimationFrame(frame); else done();
  };
  raf=requestAnimationFrame(frame);
  cleanups.push(()=>cancelAnimationFrame(raf));
  const done = ()=>{
    $("#ring").classList.add("done");
    $("#anl-t").textContent = "Diagnóstico concluído!";
    $("#anl-s").textContent = "Seu plano está pronto. Preparando o seu vídeo…";
    burst($("#ring"));
    setProg(5); el.querySelectorAll(".prog i").forEach(i=>i.classList.add("on"));
    later(renderFinal, 2200);
  };
}
function burst(host){
  for(let i=0;i<14;i++){
    const d=document.createElement("span"); d.className="burst"; host.appendChild(d);
    const a=(i/14)*Math.PI*2, r=95+Math.random()*25;
    d.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
               {transform:`translate(calc(-50% + ${Math.cos(a)*r}px), calc(-50% + ${Math.sin(a)*r}px)) scale(.3)`,opacity:0}],
              {duration:800+Math.random()*300,easing:"cubic-bezier(.2,.8,.3,1)",fill:"forwards"}).onfinish=()=>d.remove();
  }
}

/* ---------- Vídeo + WhatsApp liberado no fim ---------- */
function renderFinal(){
  cleanup();
  const pontos = QUESTIONS.map(q=>INSIGHTS[q.id][ans[q.id]]);
  const resumo = QUESTIONS.map(q=>`• ${q.label}: ${q.opts[ans[q.id]]}`).join("\n");
  const msg = `Olá! Assisti a aula gratuita.\n\nMeu diagnóstico:\n${resumo}\n\nQuero entender como começar.`;
  const wa = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  const num = CONFIG.whatsapp.replace(/^55(\d{2})(\d{5})(\d{4})$/,"($1) $2-$3");

  $("#final").innerHTML = `<div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="enter">
      <p class="tagline">Como iniciar na <strong>PRÁTICA</strong>, abrir sua loja, conectar fornecedores e começar a vender.</p>
      <div class="video" id="video"></div>
      <p class="lock" id="lock">${ICON.lock} Assista até o final para liberar o próximo passo</p>
      <div class="cta" id="cta">
        <p class="ready">Agora é com você. Me chama que eu te ajudo a começar:</p>
        <a class="btn wa glow" href="${wa}" target="_blank" rel="noopener">Falar comigo no WhatsApp</a>
        <button class="wa-fail" id="wa-fail">Não conseguiu abrir o WhatsApp?</button>
        <div class="wa-num" id="wa-num"><div><small>Me chama direto neste número:</small><b>${num}</b></div><button class="wa-copy" id="wa-copy">Copiar</button></div>
      </div>
      <div class="summary"><h3>O seu caminho, com base nas suas respostas</h3><ul>${pontos.map(p=>`<li>${p}</li>`).join("")}</ul></div>
      <button class="back" id="redo">Refazer diagnóstico</button>
    </div>`;
  $("#wa-fail").onclick = ()=>{ $("#wa-num").classList.add("show"); $("#wa-fail").classList.add("hide"); };
  $("#wa-copy").onclick = async ()=>{
    const btn=$("#wa-copy");
    try{ await navigator.clipboard.writeText(num.replace(/\D/g,"")); btn.textContent="Copiado ✓"; }
    catch(e){ btn.textContent="Copie acima"; }
  };
  $("#redo").onclick = ()=>{ for(const k in ans) delete ans[k]; step=0; cleanup(); show("intro"); };
  show("final");
  setupVideo($("#video"), unlock);
}
function unlock(){
  const c=$("#cta"); if(!c || c.classList.contains("show")) return;
  $("#lock").classList.add("hide"); c.classList.add("show");
  setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"center"}),250);
}
function setupVideo(box, onEnd){
  if(CONFIG.youtubeId){
    box.innerHTML = `<div id="yt"></div>`;
    const make = ()=> new YT.Player("yt",{ videoId:CONFIG.youtubeId,
      playerVars:{rel:0,modestbranding:1,playsinline:1},
      events:{ onStateChange:e=>{ if(e.data===0) onEnd(); } } });
    if(window.YT && YT.Player) make();
    else {
      window.onYouTubeIframeAPIReady = make;
      const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api";
      s.onerror = onEnd;               // se o YouTube não carregar, libera o botão
      document.head.appendChild(s);
    }
  } else if(CONFIG.videoArquivo){
    box.innerHTML = `<video src="${CONFIG.videoArquivo}" controls playsinline preload="metadata"></video>`;
    box.querySelector("video").addEventListener("ended", onEnd);
  } else {
    // Demonstração enquanto o vídeo real não existe
    box.innerHTML = `<div class="demo" id="demo"><div><div class="play"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#120e00"/></svg></div>Prévia: seu vídeo entra aqui</div></div><div class="vbar" id="vbar"></div>`;
    $("#demo").onclick = ()=>{
      $("#demo").innerHTML = `<div>▶ Reproduzindo prévia…</div>`;
      $("#vbar").animate([{width:"0%"},{width:"100%"}],{duration:CONFIG.demoSegundos*1000,fill:"forwards"}).onfinish = ()=>{
        $("#demo").innerHTML = `<div>✓ Vídeo concluído</div>`; onEnd();
      };
    };
  }
}

$("#start").onclick = ()=>{ unlockAudio(); step=0; renderQ(); show("quiz"); };
$("#back").onclick = ()=>{ unlockAudio(); if(step===0){ cleanup(); show("intro"); } else { step--; renderQ(); } };
</script>
